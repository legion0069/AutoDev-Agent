apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodev-controller
  namespace: autodev-system
  labels:
    app.kubernetes.io/name: autodev
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: autodev
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autodev
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: autodev-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: controller
          image: autodev/controller:v2.4.0
          imagePullPolicy: IfNotPresent
          command:
            - "python"
            - "-m"
            - "core.kubernetes_worker_controller"
          env:
            - name: AUTODEV_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AUTODEV_CONFIG_PATH
              value: "/etc/autodev/config.json"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/autodev
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: autodev-config
        - name: tmp
          emptyDir: {}
