apiVersion: v1
kind: Service
metadata:
  name: autodev-coordinator
  namespace: autodev-system
  labels:
    app.kubernetes.io/name: autodev
    app.kubernetes.io/component: coordinator
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: http-dashboard
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: ws-terminal
      port: 8765
      targetPort: 8765
      protocol: TCP
  selector:
    app.kubernetes.io/name: autodev
    app.kubernetes.io/component: coordinator
